<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Page</title>
    <style>
        /* Background and general layout */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #fff5f8;
            color: #6a4e85;
            text-align: center;
            padding: 20px;
            margin: 0;
        }

        /* Styling for the header */
        h1 {
            color: #f56fa1;
            font-size: 3em;
            text-shadow: 2px 2px 5px rgba(255, 105, 180, 0.5);
            margin-bottom: 20px;
        }

        /* Paragraph styling */
        p {
            font-size: 1.5em;
            color: #f56fa1;
            margin-bottom: 30px;
        }

        /* Image styling */
        img {
            border-radius: 15px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            border: 5px solid #f56fa1;
            max-width: 100%;
            width: 300px;
            transition: transform 0.3s ease;
        }

        img:hover {
            transform: scale(1.1);
        }

        /* Add a romantic heart icon at the bottom */
        .heart {
            font-size: 50px;
            color: #f56fa1;
            margin-top: 40px;
            animation: pulse 1.5s infinite;
        }

        /* Animation for the heart */
        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.2);
            }
            100% {
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
    <h1>I LOVEE YOUU SAYANGGKUU CINTAKUUUU MANISSKUU BUBUBBBKUUU</h1>
    <p>MAINNNN YUUUUUU MAAMMMM BAKSOOOOO GG</p>
    
    <!-- Menampilkan gambar dari Cloud Storage -->
    <img src="https://storage.googleapis.com/sales-data-learning-gcp/love%20love.jpg" alt="Love Image">
    
    <!-- Romantis Heart Icon -->
    <div class="heart">💖</div>
</body>
</html>
