{% extends "base.html" %}
{% block content %}
<h2>Your Notes</h2>
<form method="POST">
    <textarea name="content" placeholder="Write your note here..." required></textarea>
    <button type="submit">Save Note</button>
</form>
<ul>
    {% for note in notes %}
    <li>{{ note.content }}</li>
    {% endfor %}
</ul>
<a href="{{ url_for('main.index') }}">Back to Home</a>
{% endblock %}
